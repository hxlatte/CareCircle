        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 48;
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;

        }
    </style>

<body class="min-h-screen flex flex-col items-center justify-between selection:bg-secondary-container selection:text-on-secondary-fixed">
<!-- Background Layer (No Lines Rule) -->
<div class="fixed inset-0 -z-10 bg-surface">
<div class="absolute top-0 right-0 w-1/3 h-1/3 bg-secondary-container/10 rounded-full blur-[120px] -translate-y-1/2 translate-x-1/4"></div>
<div class="absolute bottom-0 left-0 w-1/2 h-1/2 bg-primary-container/5 rounded-full blur-[120px] translate-y-1/4 -translate-x-1/4"></div>
</div>
<!-- Top Navigation Placeholder (Suppressed per Shell Visibility Rule for Transactional Pages) -->
<header class="w-full py-12 px-8 max-w-7xl flex flex-col items-center">
<div class="flex items-center gap-3 mb-2">
<div class="w-10 h-10 bg-primary rounded-full flex items-center justify-center text-on-primary">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">spa</span>
</div>
<span class="text-2xl font-black text-primary tracking-tighter">CareCircle</span>
</div>
<p class="text-on-surface-variant font-medium tracking-wide">Helping families care better</p>
</header>
<!-- Main Content Canvas -->
<main class="w-full max-w-4xl px-6 py-8 flex-grow flex flex-col items-center justify-center">
<div class="text-center mb-16">
<h1 class="text-5xl md:text-6xl font-extrabold text-on-surface mb-6 tracking-tight leading-tight">
                Welcome to CareCircle
            </h1>
<p class="text-xl text-on-surface-variant max-w-lg mx-auto">
                Choose your portal to begin.
            </p>
</div>
<!-- Portal Selection Bento Grid -->
<div class="grid md:grid-cols-2 gap-8 w-full">
<!-- Senior Citizen Login Card -->
<button class="group relative flex flex-col items-center p-12 bg-surface-container-lowest rounded-xl shadow-[0_10px_30px_rgba(28,28,25,0.05)] transition-all duration-300 hover:scale-[1.02] active:scale-95 text-left overflow-hidden">
<div class="absolute inset-0 bg-primary/0 group-hover:bg-primary/[0.02] transition-colors"></div>
<div class="w-24 h-24 mb-8 bg-surface-container-low rounded-full flex items-center justify-center text-primary transition-all group-hover:bg-primary group-hover:text-on-primary">
<span class="material-symbols-outlined text-5xl" data-icon="elderly">elderly</span>
</div>
<div class="text-center">
<h3 class="text-2xl font-bold text-on-surface mb-3 tracking-tight">Login as Senior Citizen</h3>
<p class="text-on-surface-variant text-base leading-relaxed">
                        Access your daily health insights, simplified medication reminders, and family messages.
                    </p>
</div>
<div class="mt-8 flex items-center gap-2 text-primary font-bold">
<span>Enter Portal</span>
<span class="material-symbols-outlined text-sm">arrow_forward</span>
</div>
</button>
<!-- Family Member Login Card -->
<button class="group relative flex flex-col items-center p-12 bg-primary-container rounded-xl shadow-[0_10px_30px_rgba(28,28,25,0.08)] transition-all duration-300 hover:scale-[1.02] active:scale-95 text-left overflow-hidden">
<div class="absolute inset-0 bg-white/0 group-hover:bg-white/[0.05] transition-colors"></div>
<div class="w-24 h-24 mb-8 bg-on-primary-container rounded-full flex items-center justify-center text-primary-container transition-all group-hover:bg-on-primary group-hover:text-primary">
<span class="material-symbols-outlined text-5xl" data-icon="family_history" style="font-variation-settings: 'FILL' 1;">family_history</span>
</div>
<div class="text-center">
<h3 class="text-2xl font-bold text-on-primary mb-3 tracking-tight">Login as Family Member</h3>
<p class="text-on-primary-container/80 text-base leading-relaxed">
                        Coordinate care, view health trends, and stay connected with your circle of loved ones.
                    </p>
</div>
<div class="mt-8 flex items-center gap-2 text-on-primary font-bold">
<span>Enter Portal</span>
<span class="material-symbols-outlined text-sm">arrow_forward</span>
</div>
</button>
</div>
<!-- Social Proof/Warmth Image -->
<div class="mt-20 w-full rounded-xl overflow-hidden relative h-64 grayscale-[20%] opacity-90">
<img alt="Heartfelt moment" class="w-full h-full object-cover" data-alt="Soft focused warm lifestyle photography of an elderly person and younger family member holding hands in a sunlit living room with natural green plants." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBnkdlw-JbB_02C_vK80Q1OjxmUjRiLGoq53dnWSxW-kMRbhp1wQR9AUKa4uWq4uwjzyV7KWBDu3aXEj6sHk1TRL7XJY4JsQ0e8ZjZZdQklyX9J2tsBR7Ftk3ApnV1RNaDQ_awVAesv9FhEaqkfM2Aqu8Ja1jUqw5wj6YOGWTzk0dGesysCQQ7z_F7H-PSfN_kV9UZvpNNDoRqzM8oQDe-o_ouQHcf5DF59NnQAXN1s3s5a65PxN-ooClWomNa-r8P0xS2_LubMzzY"/>
<div class="absolute inset-0 bg-gradient-to-t from-surface-container-low to-transparent"></div>
</div>
</main>
<!-- Footer -->
<footer class="w-full py-12 px-8 flex flex-col items-center">
<div class="flex items-center gap-8 mb-4">
<a class="text-sm font-semibold text-on-surface-variant hover:text-primary transition-colors" href="#">Terms of Service</a>
<span class="w-1 h-1 bg-outline-variant rounded-full"></span>
<a class="text-sm font-semibold text-on-surface-variant hover:text-primary transition-colors" href="#">Privacy Policy</a>
<span class="w-1 h-1 bg-outline-variant rounded-full"></span>
<a class="text-sm font-semibold text-on-surface-variant hover:text-primary transition-colors" href="#">Help Center</a>
</div>
<p class="text-xs text-outline font-medium tracking-wider uppercase">© 2024 CareCircle Sanctuary. All Rights Reserved.</p>
</footer>
